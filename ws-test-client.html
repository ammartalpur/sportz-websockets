<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportz WebSocket Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #4ade80;
        }

        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, textarea, select {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .button-group button {
            flex: 1;
        }

        .log {
            flex: 1;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            overflow-y: auto;
            padding: 0;
            background: #f9fafb;
        }

        .log-entry {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            display: flex;
            gap: 8px;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-timestamp {
            color: #9ca3af;
            flex-shrink: 0;
            min-width: 120px;
            font-weight: 600;
        }

        .log-message {
            flex: 1;
            word-break: break-word;
            color: #374151;
        }

        .log-entry.info .log-message {
            color: #3b82f6;
        }

        .log-entry.success .log-message {
            color: #10b981;
            font-weight: 600;
        }

        .log-entry.error .log-message {
            color: #ef4444;
            font-weight: 600;
        }

        .log-entry.warning .log-message {
            color: #f59e0b;
            font-weight: 600;
        }

        .clear-btn {
            background: #6b7280;
            margin-top: 10px;
        }

        .clear-btn:hover {
            box-shadow: 0 5px 15px rgba(107, 114, 128, 0.4);
        }

        .config-section {
            margin-bottom: 15px;
        }

        .config-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 700;
        }

        .connection-url {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="title">🏆 Sportz WebSocket Test Client</div>

    <div class="container">
        <!-- Configuration Panel -->
        <div class="panel">
            <div class="header">
                ⚙️ Configuration
                <div class="status-badge">
                    <div class="status-dot disconnected" id="statusDot"></div>
                    <span id="statusText">Disconnected</span>
                </div>
            </div>
            <div class="content">
                <div class="config-section">
                    <label class="config-label">WebSocket URL</label>
                    <div class="input-group">
                        <input type="text" id="wsUrl" value="ws://localhost:8000/ws" placeholder="ws://localhost:8000/ws">
                    </div>
                </div>

                <div class="button-group">
                    <button id="connectBtn" onclick="connect()">Connect</button>
                    <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
                </div>

                <div class="config-section">
                    <label class="config-label">Subscribe to Match</label>
                    <div class="input-group">
                        <input type="number" id="matchId" placeholder="Match ID" min="1" value="1">
                        <button onclick="subscribe()">Subscribe</button>
                    </div>
                </div>

                <div class="config-section">
                    <label class="config-label">Unsubscribe from Match</label>
                    <div class="input-group">
                        <input type="number" id="unsubscribeMatchId" placeholder="Match ID" min="1" value="1">
                        <button onclick="unsubscribe()">Unsubscribe</button>
                    </div>
                </div>

                <div class="config-section">
                    <label class="config-label">Send Custom Message</label>
                    <div class="input-group">
                        <textarea id="customMessage" placeholder='{"type":"subscribe","matchId":1}' rows="4"></textarea>
                    </div>
                    <button onclick="sendCustom()" style="width: 100%;">Send</button>
                </div>

                <div class="button-group" style="margin-top: auto;">
                    <button class="clear-btn" onclick="clearLog()">Clear Log</button>
                </div>
            </div>
        </div>

        <!-- Message Log Panel -->
        <div class="panel">
            <div class="header">
                📨 Message Log
                <span id="messageCount" style="font-size: 14px; opacity: 0.8;">0 messages</span>
            </div>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;

        function log(message, type = 'info') {
            const logElement = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const now = new Date();
            const timestamp = now.toLocaleTimeString('en-US', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                fractionalSecondDigits: 3
            });
            
            entry.innerHTML = `
                <div class="log-timestamp">${timestamp}</div>
                <div class="log-message">${escapeHtml(message)}</div>
            `;
            
            logElement.appendChild(entry);
            logElement.scrollTop = logElement.scrollHeight;
            messageCount++;
            document.getElementById('messageCount').textContent = `${messageCount} messages`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            if (connected) {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function connect() {
            const url = document.getElementById('wsUrl').value;
            
            if (!url) {
                alert('Please enter a WebSocket URL');
                return;
            }

            try {
                ws = new WebSocket(url);
                
                ws.onopen = () => {
                    log('✅ WebSocket Connected', 'success');
                    updateStatus(true);
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        log(`📥 Received: ${JSON.stringify(data, null, 2)}`, 'info');
                    } catch (e) {
                        log(`📥 Received: ${event.data}`, 'info');
                    }
                };
                
                ws.onerror = (error) => {
                    log(`❌ WebSocket Error: ${error.message || 'Connection Error'}`, 'error');
                };
                
                ws.onclose = () => {
                    log('⏹️ WebSocket Disconnected', 'warning');
                    updateStatus(false);
                    ws = null;
                };
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
                updateStatus(false);
            }
        }

        function subscribe() {
            const matchId = document.getElementById('matchId').value;
            
            if (!matchId) {
                alert('Please enter a Match ID');
                return;
            }
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected');
                return;
            }
            
            const message = {
                type: 'subscribe',
                matchId: parseInt(matchId)
            };
            
            ws.send(JSON.stringify(message));
            log(`📤 Sent: ${JSON.stringify(message)}`, 'success');
        }

        function unsubscribe() {
            const matchId = document.getElementById('unsubscribeMatchId').value;
            
            if (!matchId) {
                alert('Please enter a Match ID');
                return;
            }
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected');
                return;
            }
            
            const message = {
                type: 'unsubscribe',
                matchId: parseInt(matchId)
            };
            
            ws.send(JSON.stringify(message));
            log(`📤 Sent: ${JSON.stringify(message)}`, 'success');
        }

        function sendCustom() {
            const customMessage = document.getElementById('customMessage').value;
            
            if (!customMessage) {
                alert('Please enter a message');
                return;
            }
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected');
                return;
            }
            
            try {
                ws.send(customMessage);
                log(`📤 Sent: ${customMessage}`, 'success');
            } catch (error) {
                log(`❌ Error sending message: ${error.message}`, 'error');
            }
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            messageCount = 0;
            document.getElementById('messageCount').textContent = '0 messages';
        }

        // Initialize
        updateStatus(false);
        log('🚀 WebSocket Test Client Ready', 'success');
    </script>
</body>
</html>
